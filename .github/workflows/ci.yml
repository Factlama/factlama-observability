name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # F10 of the 2026-09-21 G0-G4 validation report: this was previously
      # unpinned (defaulting to factlama-architecture's own default branch
      # HEAD at CI-run time), so the same observability commit could
      # validate against a different, possibly incompatible contracts/v0.1
      # revision on different days. Pinned to a known-compatible commit;
      # bump this `ref` deliberately (in the same PR as any
      # contract-affecting change) rather than letting it drift silently.
      - name: Checkout factlama-architecture (canonical contracts/v0.1 fixtures)
        uses: actions/checkout@v4
        with:
          repository: Factlama/factlama-architecture
          ref: e2a022e8187e72708a224ac29d5cc8575b004af2
          path: factlama-architecture

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev,storage]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy schemas sdk collector storage query operations

      - name: Dependency-boundary check (import-linter)
        run: lint-imports

      - name: Tests (pytest), including the OBS-03 contract fixture suite
        run: pytest --cov=schemas --cov=sdk --cov=collector --cov=storage --cov=query --cov=operations --cov-report=term-missing
        env:
          FACTLAMA_CONTRACTS_DIR: ${{ github.workspace }}/factlama-architecture/contracts/v0.1

      - name: Alembic no-op migration smoke test
        run: alembic -c storage/migrations/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite:///./_ci_alembic_smoke.db

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
