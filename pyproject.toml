[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlama-observability"
version = "0.1.0"
description = "FactLama Observability: SDK, collector, storage, query API foundations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "FactLama Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    # OBS-06 (mirrors factlama-reliability's G5/ADR-019 rationale): PostgreSQL
    # is this repo's shipped/tested persistence backend for tenant-keyed
    # telemetry, not an optional extra -- every real collector deployment
    # needs somewhere to durably write an ingested ReliabilityEvent.
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "import-linter>=2.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    # OBS-06's storage conformance suite must run against a real database
    # instance, not mocks (same rule as factlama-reliability's ADR-019 SS4).
    # testcontainers launches/tears down a throwaway Postgres via the local
    # Docker daemon already present on GitHub Actions ubuntu-latest runners.
    "testcontainers[postgres]>=4.0.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "sdk", "collector", "storage", "query", "operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
# CI checks out factlama-architecture as a subdirectory (actions/checkout
# cannot place it outside $GITHUB_WORKSPACE) solely to read contracts/v0.1's
# fixtures; this repo's lint/format rules do not apply to that repo's own code.
extend-exclude = ["factlama-architecture"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "sdk", "collector", "storage", "query", "operations"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["alembic.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["schemas", "sdk", "collector", "storage", "query", "operations"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "schemas is a pure data layer with no internal dependencies"
type = "forbidden"
source_modules = ["schemas"]
forbidden_modules = ["sdk", "collector", "storage", "query", "operations"]

[[tool.importlinter.contracts]]
name = "sdk is an independent client and must not depend on server-side components"
type = "forbidden"
source_modules = ["sdk"]
forbidden_modules = ["collector", "storage", "query"]

[[tool.importlinter.contracts]]
name = "storage is a foundation layer and must not depend on collector, query, or sdk"
type = "forbidden"
source_modules = ["storage"]
forbidden_modules = ["collector", "query", "sdk"]

[[tool.importlinter.contracts]]
name = "query must not depend on collector or sdk (independent consumers of storage)"
type = "forbidden"
source_modules = ["query"]
forbidden_modules = ["collector", "sdk"]

[[tool.importlinter.contracts]]
# OBS-06, mirroring factlama-reliability's ADR-019 SS2/SS3 rule: everything
# above the storage layer depends on storage.backend's Protocol only, never
# the concrete Postgres adapter -- collector.ingress.bootstrap is the one
# composition-root module allowed to construct it.
name = "collector must depend on storage.backend, not the concrete storage.postgres adapter"
type = "forbidden"
source_modules = ["collector"]
forbidden_modules = ["storage.postgres"]
ignore_imports = [
    "collector.ingress.bootstrap -> storage.postgres.backend",
    "collector.ingress.bootstrap -> storage.postgres.engine",
]

[[tool.importlinter.contracts]]
name = "storage.backend/errors are a pure protocol layer with no vendor imports"
type = "forbidden"
source_modules = ["storage.backend", "storage.errors"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic"]
