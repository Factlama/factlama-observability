[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlama-observability"
version = "0.1.0"
description = "FactLama Observability: SDK, collector, storage, query API foundations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "FactLama Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "import-linter>=2.0",
]
storage = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sdk", "collector", "storage", "query", "operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sdk", "collector", "storage", "query", "operations"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["alembic.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["sdk", "collector", "storage", "query", "operations"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "sdk is an independent client and must not depend on server-side components"
type = "forbidden"
source_modules = ["sdk"]
forbidden_modules = ["collector", "storage", "query"]

[[tool.importlinter.contracts]]
name = "storage is a foundation layer and must not depend on collector, query, or sdk"
type = "forbidden"
source_modules = ["storage"]
forbidden_modules = ["collector", "query", "sdk"]

[[tool.importlinter.contracts]]
name = "query must not depend on collector or sdk (independent consumers of storage)"
type = "forbidden"
source_modules = ["query"]
forbidden_modules = ["collector", "sdk"]
